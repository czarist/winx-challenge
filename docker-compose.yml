services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      pgsql:
        condition: service_healthy
    healthcheck:
      # Só fica "healthy" quando o php-fpm está de fato aceitando conexões,
      # ou seja, depois que o entrypoint termina install/migrate/seed. Sem
      # isso o nginx pode subir e começar a receber tráfego antes do app
      # estar pronto e ficar preso respondendo 502.
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) === false ? 1 : 0);"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

  nginx:
    image: nginx:alpine
    ports:
      - "${APP_FORWARD_PORT:-8000}:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  queue:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: ["php", "artisan", "queue:work", "--tries=3", "--sleep=3"]
    volumes:
      - .:/var/www/html
    env_file:
      - .env
    depends_on:
      pgsql:
        condition: service_healthy

  pgsql:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_FORWARD_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME} -d ${DB_DATABASE}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
