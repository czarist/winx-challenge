server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 20M;

    # Resolver embutido do Docker + fastcgi_pass em variável: força o nginx
    # a resolver "app" de novo a cada request em vez de fixar o IP uma
    # única vez ao carregar a config. Sem isso, recriar só o container app
    # (ex.: depois de um `docker compose up -d` que só mudou o .env) deixa
    # o nginx apontando para um IP morto até ele também ser reiniciado.
    resolver 127.0.0.11 valid=10s;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        set $php_upstream app:9000;
        fastcgi_pass $php_upstream;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
